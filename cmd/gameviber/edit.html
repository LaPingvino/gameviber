<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameViber editor</title>
<style>
:root { --bg: #f5f1e8; --panel: #fffdf8; --ink: #2a2118; --muted: #7a6c5a; --line: #e2d8c6; --accent: #c2541b; --ok: #2f7a3a; --bad: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg: #1b1713; --panel: #241f1a; --ink: #efe6d8; --muted: #a8977f; --line: #3a3229; --accent: #f08a4b; --ok: #7fc28a; --bad: #f2867d; } }
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto 1fr auto; background: var(--bg); color: var(--ink); font: 14px system-ui, sans-serif; }
header { grid-column: 1 / 3; display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); }
header b { font-size: 15px; } header span { color: var(--muted); }
nav { overflow: auto; border-right: 1px solid var(--line); padding: 8px 0; background: var(--panel); }
nav details { padding: 0 8px; } nav summary { cursor: pointer; padding: 3px 4px; font-weight: 600; }
nav a { display: block; padding: 3px 4px 3px 18px; color: var(--ink); text-decoration: none; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 13px; }
nav a:hover { background: var(--line); } nav a.on { background: var(--accent); color: #fff; }
main { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.bar { display: flex; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); }
.bar code { flex: 1; overflow: hidden; text-overflow: ellipsis; }
button { font: inherit; padding: 5px 14px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
textarea { width: 100%; height: 100%; resize: none; border: 0; padding: 12px; background: var(--panel); color: var(--ink); font: 13px/1.5 ui-monospace, monospace; tab-size: 4; outline: none; }
footer { grid-column: 1 / 3; border-top: 1px solid var(--line); padding: 6px 14px; max-height: 30vh; overflow: auto; }
footer pre { margin: 0; font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
</style></head>
<body>
<header><b>GameViber</b><span id="name"></span><span id="status"></span></header>
<nav id="tree"></nav>
<main>
  <div class="bar"><code id="path">pick a file on the left</code><button id="save" disabled>Save (Ctrl+S)</button></div>
  <textarea id="text" spellcheck="false" disabled></textarea>
</main>
<footer><pre id="check">…</pre></footer>
<script>
const $ = (id) => document.getElementById(id);
let current = null, saved = "";
function showCheck(c) {
  $("check").className = c.problems ? "bad" : "ok";
  $("check").textContent = c.report;
}
function dirty() { return current && $("text").value !== saved; }
function mark() { $("save").disabled = !dirty(); $("status").textContent = dirty() ? "· unsaved" : ""; }
async function load() {
  const r = await (await fetch("api/files")).json();
  $("name").textContent = r.name;
  const groups = {};
  for (const f of r.files) {
    const parts = f.split("/");
    const g = parts.length > 2 ? parts.slice(0, 2).join("/") : (parts.length > 1 ? parts[0] : "");
    (groups[g] ||= []).push(f);
  }
  const tree = $("tree"); tree.textContent = "";
  for (const g of Object.keys(groups).sort()) {
    const box = g ? Object.assign(document.createElement("details"), { open: !g.includes("/") || g.startsWith("objects/") }) : tree;
    if (g) { box.append(Object.assign(document.createElement("summary"), { textContent: g })); tree.append(box); }
    for (const f of groups[g]) {
      const a = Object.assign(document.createElement("a"), { href: "#", textContent: g ? f.slice(g.length + 1) : f });
      a.onclick = (e) => { e.preventDefault(); open(f, a); };
      box.append(a);
    }
  }
  showCheck(await (await fetch("api/check")).json());
}
async function open(f, a) {
  if (dirty() && !window.confirm("Leave without saving?")) return;
  const t = await (await fetch("api/file?path=" + encodeURIComponent(f))).text();
  current = f; saved = t;
  $("path").textContent = f; $("text").value = t; $("text").disabled = false;
  document.querySelectorAll("nav a.on").forEach((x) => x.classList.remove("on"));
  a.classList.add("on"); mark();
}
async function save() {
  if (!dirty()) return;
  const body = $("text").value;
  const r = await fetch("api/file?path=" + encodeURIComponent(current), { method: "PUT", body });
  if (!r.ok) { $("check").className = "bad"; $("check").textContent = await r.text(); return; }
  saved = body; mark(); showCheck(await r.json());
}
$("text").addEventListener("input", mark);
$("save").onclick = save;
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); } });
$("text").addEventListener("keydown", (e) => { if (e.key === "Tab") { e.preventDefault(); document.execCommand("insertText", false, "\t"); } });
load();
</script>
</body></html>
