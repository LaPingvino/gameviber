<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameViber editor</title>
<style>
:root { --bg: #f5f1e8; --panel: #fffdf8; --ink: #2a2118; --muted: #7a6c5a; --line: #e2d8c6; --accent: #c2541b; --ok: #2f7a3a; --bad: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg: #1b1713; --panel: #241f1a; --ink: #efe6d8; --muted: #a8977f; --line: #3a3229; --accent: #f08a4b; --ok: #7fc28a; --bad: #f2867d; } }
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto 1fr auto; background: var(--bg); color: var(--ink); font: 14px system-ui, sans-serif; }
header { grid-column: 1 / 3; display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); }
header b { font-size: 15px; } header span { color: var(--muted); }
nav { overflow: auto; border-right: 1px solid var(--line); padding: 8px 0; background: var(--panel); }
nav details { padding: 0 8px; } nav summary { cursor: pointer; padding: 3px 4px; font-weight: 600; }
nav a { display: block; padding: 3px 4px 3px 18px; color: var(--ink); text-decoration: none; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 13px; }
nav a:hover { background: var(--line); } nav a.on { background: var(--accent); color: #fff; }
main { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.bar { display: flex; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); }
.bar code { flex: 1; overflow: hidden; text-overflow: ellipsis; }
button { font: inherit; padding: 5px 14px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
#room { display: none; grid-template-columns: 150px 1fr; min-height: 0; }
#room.on { display: grid; }
#palette { overflow: auto; border-right: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 4px; }
#palette button { display: flex; align-items: center; gap: 8px; background: transparent; color: var(--ink); border: 1px solid var(--line); text-align: left; padding: 4px 6px; }
#palette button.on { border-color: var(--accent); background: var(--line); }
#palette canvas { width: 24px; height: 24px; image-rendering: pixelated; }
#stage { overflow: auto; padding: 10px; }
#stage canvas { image-rendering: pixelated; border: 1px solid var(--line); cursor: crosshair; }
.hint { color: var(--muted); font-size: 12px; }
#sprite { display: none; padding: 12px; overflow: auto; gap: 16px; }
#sprite.on { display: flex; flex-wrap: wrap; align-items: flex-start; }
#sprite canvas { image-rendering: pixelated; border: 1px solid var(--line); background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
#sprite fieldset { border: 1px solid var(--line); border-radius: 6px; display: grid; grid-template-columns: auto 64px; gap: 6px 10px; align-items: center; }
#sprite input[type=number] { width: 64px; font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
textarea { width: 100%; height: 100%; resize: none; border: 0; padding: 12px; background: var(--panel); color: var(--ink); font: 13px/1.5 ui-monospace, monospace; tab-size: 4; outline: none; }
footer { grid-column: 1 / 3; border-top: 1px solid var(--line); padding: 6px 14px; max-height: 30vh; overflow: auto; }
footer pre { margin: 0; font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
</style></head>
<body>
<header><b>GameViber</b><span id="name"></span><span id="status"></span><span style="flex:1"></span><button id="reset" style="display:none;background:transparent;color:var(--muted);border:1px solid var(--line)">Reset to the starter game</button><button id="newspr" style="background:transparent;color:var(--ink);border:1px solid var(--line)">+ Sprite</button><button id="play">▶ Play</button></header>
<nav id="tree"></nav>
<main>
  <div class="bar"><code id="path">pick a file on the left</code><button id="save" disabled>Save (Ctrl+S)</button></div>
  <textarea id="text" spellcheck="false" disabled></textarea>
  <iframe id="game" title="the game" style="display:none;width:100%;height:100%;border:0;background:#111"></iframe>
  <div id="sprite"><div><canvas id="spr"></canvas><div id="frames"></div></div>
    <fieldset><legend id="sprname"></legend>
      <label>origin x</label><input type="number" id="ox"><label>origin y</label><input type="number" id="oy">
      <label>box left</label><input type="number" id="bl"><label>box top</label><input type="number" id="bt">
      <label>box right</label><input type="number" id="br"><label>box bottom</label><input type="number" id="bb">
      <label>precise</label><input type="checkbox" id="precise">
      <span class="hint" style="grid-column: 1 / 3">red: the origin · green: the bounding box</span>
      <label>frames in a picture</label><input type="number" id="nframes" min="1" value="1">
      <label style="grid-column: 1 / 3"><button type="button" id="replace">Replace picture…</button></label></fieldset></div>
  <input type="file" id="pngfile" accept="image/png" style="display:none">
  <div id="room"><div id="palette"></div><div id="stage"><canvas id="canvas"></canvas>
    <p class="hint">Click: place the chosen object (on the 32 px grid; Shift: free) · right click: remove · <a href="#" id="astext">as text</a></p></div></div>
</main>
<footer><pre id="check">…</pre></footer>
<script>
const $ = (id) => document.getElementById(id);
// The editor's requests: to the local server (gameviber edit), or — on the
// published page, where there is none — to the editor running in the page
// (gameviberAPI, the same Go code as WebAssembly).
async function call(path, opts = {}) {
  if (!window.gameviberStatic) return fetch(path, opts);
  await window.gameviberWait;
  const r = await window.gameviberAPI(opts.method || "GET", path, opts.body);
  return new Response(r.body, { status: r.status, headers: { "Content-Type": r.type || "text/plain" } });
}
let current = null, saved = "";
function showCheck(c) {
  $("check").className = c.problems ? "bad" : "ok";
  $("check").textContent = c.report;
}
function dirty() { return current && $("text").value !== saved; }
function mark() { $("save").disabled = !dirty(); $("status").textContent = dirty() ? "· unsaved" : ""; }
async function load() {
  const r = await (await call("api/files")).json();
  $("name").textContent = r.name;
  const groups = {};
  for (const f of r.files) {
    const parts = f.split("/");
    const g = parts.length > 2 ? parts.slice(0, 2).join("/") : (parts.length > 1 ? parts[0] : "");
    (groups[g] ||= []).push(f);
  }
  const tree = $("tree"); tree.textContent = "";
  for (const g of Object.keys(groups).sort()) {
    const box = g ? Object.assign(document.createElement("details"), { open: !g.includes("/") || g.startsWith("objects/") }) : tree;
    if (g) { box.append(Object.assign(document.createElement("summary"), { textContent: g })); tree.append(box); }
    for (const f of groups[g]) {
      const a = Object.assign(document.createElement("a"), { href: "#", textContent: g ? f.slice(g.length + 1) : f });
      a.onclick = (e) => { e.preventDefault(); open(f, a); };
      box.append(a);
    }
  }
  showCheck(await (await call("api/check")).json());
}
// --- rooms (step E2): the grid ---
let room = null, roomPath = null, chosen = null, roomSaved = "";
const strips = {};
function strip(name) {
  if (!strips[name]) {
    strips[name] = new Image(); strips[name].onload = drawRoom;
    const path = "api/strip?sprite=" + encodeURIComponent(name);
    if (!window.gameviberStatic) strips[name].src = path;
    else call(path).then((r) => r.blob()).then((b) => { strips[name].src = URL.createObjectURL(b); });
  }
  return strips[name];
}
function spriteOf(obj) { const o = room.objects.find((x) => x.name === obj); return o && o.sprite; }
function drawSprite(ctx, sprite, x, y) {
  const s = room.sprites[sprite], img = strip(sprite);
  if (s && img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0, s.W, s.H, x - s.OX, y - s.OY, s.W, s.H);
  else { ctx.fillStyle = "#c2541b88"; ctx.fillRect(x, y, 16, 16); }
}
function drawRoom() {
  if (!room) return;
  const c = $("canvas"), ctx = c.getContext("2d");
  c.width = room.width; c.height = room.height;
  const scale = Math.max(1, Math.floor(Math.min(($("stage").clientWidth - 24) / room.width, ($("stage").clientHeight - 40) / room.height)));
  c.style.width = room.width * scale + "px"; c.style.height = room.height * scale + "px";
  ctx.fillStyle = room.background || "#000"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.strokeStyle = "rgba(255,255,255,.08)";
  for (let x = 0; x < c.width; x += 32) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, c.height); ctx.stroke(); }
  for (let y = 0; y < c.height; y += 32) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(c.width, y + .5); ctx.stroke(); }
  for (const i of room.instances) { const sp = spriteOf(i.object); if (sp) drawSprite(ctx, sp, i.x, i.y); else { ctx.fillStyle = "#fff8"; ctx.fillRect(i.x, i.y, 8, 8); } }
}
function roomDirty() { return room && JSON.stringify(room.instances) !== roomSaved; }
function at(e) {
  const c = $("canvas"), r = c.getBoundingClientRect();
  return [Math.floor((e.clientX - r.left) * c.width / r.width), Math.floor((e.clientY - r.top) * c.height / r.height)];
}
$("canvas").addEventListener("mousedown", (e) => {
  if (!room) return;
  let [x, y] = at(e);
  if (e.button === 2) { // remove the topmost instance under the pointer
    for (let k = room.instances.length - 1; k >= 0; k--) {
      const i = room.instances[k], s = room.sprites[spriteOf(i.object)] || { W: 16, H: 16, OX: 0, OY: 0 };
      if (x >= i.x - s.OX && x < i.x - s.OX + s.W && y >= i.y - s.OY && y < i.y - s.OY + s.H) { room.instances.splice(k, 1); break; }
    }
  } else if (chosen) {
    if (!e.shiftKey) { x -= x % 32; y -= y % 32; }
    room.instances.push({ object: chosen, x, y });
  }
  drawRoom(); markRoom();
});
$("canvas").addEventListener("contextmenu", (e) => e.preventDefault());
function markRoom() { $("save").disabled = !roomDirty(); $("status").textContent = roomDirty() ? "· unsaved" : ""; }
async function openRoom(dir, a) {
  room = await (await call("api/room?path=" + encodeURIComponent(dir))).json();
  roomPath = dir; roomSaved = JSON.stringify(room.instances); current = null;
  $("path").textContent = dir + " (room)"; $("text").style.display = "none"; $("room").classList.add("on");
  const pal = $("palette"); pal.textContent = "";
  for (const o of room.objects) {
    const b = document.createElement("button"), cv = document.createElement("canvas");
    cv.width = 32; cv.height = 32;
    if (o.sprite) { const img = strip(o.sprite), s = room.sprites[o.sprite]; const paint = () => s && img.naturalWidth && cv.getContext("2d").drawImage(img, 0, 0, s.W, s.H, 0, 0, 32, 32); img.addEventListener("load", paint); paint(); }
    b.append(cv, o.name);
    b.onclick = () => { chosen = o.name; pal.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); };
    pal.append(b);
  }
  document.querySelectorAll("nav a.on").forEach((x) => x.classList.remove("on"));
  a.classList.add("on"); drawRoom(); markRoom();
}
async function saveRoom() {
  if (!roomDirty()) return;
  const r = await call("api/room?path=" + encodeURIComponent(roomPath), { method: "PUT", body: JSON.stringify(room.instances) });
  if (!r.ok) { $("check").className = "bad"; $("check").textContent = await r.text(); return; }
  roomSaved = JSON.stringify(room.instances); markRoom(); showCheck(await r.json());
}
$("astext").onclick = (e) => { e.preventDefault(); const a = document.querySelector("nav a.on"); room = null; open(roomPath + "/room.toml", a, true); };
window.addEventListener("resize", drawRoom);

// --- sprites (step E4): view, origin, box ---
let spr = null, sprPath = null, sprSaved = "";
const fields = { ox: ["origin", 0], oy: ["origin", 1], bl: ["bbox_lrbt", 0], br: ["bbox_lrbt", 1], bb: ["bbox_lrbt", 2], bt: ["bbox_lrbt", 3] };
function sprState() { return JSON.stringify({ origin: spr.origin, bbox_lrbt: spr.bbox_lrbt, precise: spr.precise }); }
function sprDirty() { return spr && sprState() !== sprSaved; }
function drawSprite2() {
  if (!spr) return;
  const img = strip(spr.name), w = spr.frame_w, h = spr.frame_h;
  const k = Math.max(1, Math.floor(Math.min(320 / w, 320 / h)));
  const c = $("spr"); c.width = w * k; c.height = h * k;
  const ctx = c.getContext("2d"); ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, c.width, c.height);
  if (img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0, w, h, 0, 0, w * k, h * k);
  const [l, r, b, t] = spr.bbox_lrbt;
  ctx.strokeStyle = "#1fae4a"; ctx.lineWidth = 2; ctx.strokeRect(l * k + 1, t * k + 1, (r - l + 1) * k - 2, (b - t + 1) * k - 2);
  const [ox, oy] = spr.origin;
  ctx.strokeStyle = "#e0302a"; ctx.beginPath();
  ctx.moveTo(ox * k - 8, oy * k); ctx.lineTo(ox * k + 8, oy * k); ctx.moveTo(ox * k, oy * k - 8); ctx.lineTo(ox * k, oy * k + 8); ctx.stroke();
  const fr = $("frames"); fr.textContent = "";
  for (let i = 0; i < spr.frames; i++) {
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.style.width = w * 2 + "px";
    if (img.complete) cv.getContext("2d").drawImage(img, i * w, 0, w, h, 0, 0, w, h);
    fr.append(cv);
  }
  $("save").disabled = !sprDirty(); $("status").textContent = sprDirty() ? "· unsaved" : "";
}
for (const [id, [key, i]] of Object.entries(fields)) $(id).addEventListener("input", () => { spr[key][i] = Number($(id).value) || 0; drawSprite2(); });
$("precise").addEventListener("change", () => { spr.precise = $("precise").checked; drawSprite2(); });
async function openSprite(dir, a) {
  spr = await (await call("api/sprite?path=" + encodeURIComponent(dir))).json();
  sprPath = dir; sprSaved = sprState(); current = null; room = null;
  $("path").textContent = dir + " (sprite)"; $("text").style.display = "none"; $("room").classList.remove("on"); $("sprite").classList.add("on");
  $("sprname").textContent = spr.name + " — " + spr.frames + " frame(s), " + spr.frame_w + "×" + spr.frame_h;
  for (const [id, [key, i]] of Object.entries(fields)) $(id).value = spr[key][i];
  $("precise").checked = !!spr.precise;
  const img = strip(spr.name); img.addEventListener("load", drawSprite2);
  document.querySelectorAll("nav a.on").forEach((x) => x.classList.remove("on")); a.classList.add("on");
  drawSprite2();
}
async function saveSprite() {
  if (!sprDirty()) return;
  const r = await call("api/sprite?path=" + encodeURIComponent(sprPath), { method: "PUT", body: sprState() });
  if (!r.ok) { $("check").className = "bad"; $("check").textContent = await r.text(); return; }
  sprSaved = sprState(); drawSprite2(); showCheck(await r.json());
}

async function open(f, a, asText) {
  if ((dirty() || roomDirty() || sprDirty()) && !window.confirm("Leave without saving?")) return;
  spr = null; $("sprite").classList.remove("on");
  const m = f.match(/^(rooms\/[^/]+)\/room\.toml$/);
  if (m && !asText) return openRoom(m[1], a);
  const ms = f.match(/^(sprites\/[^/]+)\/sprite\.toml$/);
  if (ms && !asText) return openSprite(ms[1], a);
  room = null; $("room").classList.remove("on"); $("text").style.display = "";
  const t = await (await call("api/file?path=" + encodeURIComponent(f))).text();
  current = f; saved = t;
  $("path").textContent = f; $("text").value = t; $("text").disabled = false;
  document.querySelectorAll("nav a.on").forEach((x) => x.classList.remove("on"));
  a.classList.add("on"); mark();
}
async function save() {
  if (spr) return saveSprite();
  if (room) return saveRoom();
  if (!dirty()) return;
  const body = $("text").value;
  const r = await call("api/file?path=" + encodeURIComponent(current), { method: "PUT", body });
  if (!r.ok) { $("check").className = "bad"; $("check").textContent = await r.text(); return; }
  saved = body; mark(); showCheck(await r.json());
}
$("text").addEventListener("input", mark);
$("save").onclick = save;
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); } });
$("text").addEventListener("keydown", (e) => { if (e.key === "Tab") { e.preventDefault(); document.execCommand("insertText", false, "\t"); } });
// --- Play (step E3): the game in the editor, from the saved files ---
let playing = false, before = null;
$("play").onclick = () => {
  playing = !playing;
  const g = $("game");
  if (playing) {
    before = { text: $("text").style.display, room: $("room").classList.contains("on"), sprite: $("sprite").classList.contains("on") };
    $("text").style.display = "none"; $("room").classList.remove("on"); $("sprite").classList.remove("on");
    g.style.display = "";
    if (!window.gameviberStatic) { g.src = "play/"; g.focus(); }
    else call("play/project.tar").then((r) => r.blob()).then((b) => { g.src = "play.html?project=" + encodeURIComponent(URL.createObjectURL(b)); g.focus(); });
    $("play").textContent = "■ Stop"; $("path").textContent = "playing (the saved files)";
  } else {
    g.src = "about:blank"; g.style.display = "none";
    $("text").style.display = before.text; if (before.room) $("room").classList.add("on"); if (before.sprite) $("sprite").classList.add("on");
    $("play").textContent = "▶ Play"; $("path").textContent = current || (roomPath ? roomPath + " (room)" : "pick a file on the left");
  }
};
// --- pictures (step E4b): a PNG as a sprite's frames (side by side) ---
let importName = null;
async function importPNG(name, file, frames) {
  const data = new Uint8Array(await file.arrayBuffer());
  const r = await call("api/sprite-png?name=" + encodeURIComponent(name) + "&frames=" + frames, { method: "POST", body: data });
  if (!r.ok) { $("check").className = "bad"; $("check").textContent = await r.text(); return; }
  showCheck(await r.json());
  delete strips[name];
  await load();
  const link = [...document.querySelectorAll("nav a")].find((a) => a.textContent === "sprite.toml" && a.parentElement.querySelector("summary")?.textContent === "sprites/" + name);
  if (link) openSprite("sprites/" + name, link);
}
$("pngfile").addEventListener("change", () => {
  const f = $("pngfile").files[0];
  if (f && importName) importPNG(importName, f, Math.max(1, Number($("nframes").value) || 1));
  $("pngfile").value = "";
});
$("replace").onclick = () => { importName = spr.name; $("pngfile").click(); };
$("newspr").onclick = () => {
  const name = (window.prompt("The new sprite's name (a–z, 0–9, _):") || "").trim().toLowerCase();
  if (!name) return;
  importName = name; $("nframes").value = 1; $("pngfile").click();
};

if (window.gameviberStatic) { // the published page: the project lives in this browser
  $("reset").style.display = "";
  $("reset").onclick = () => { if (window.confirm("Throw away your changes and start again from the starter game?")) { window.gameviberWait.then(() => window.gameviberReset()); } };
}
load();
</script>
</body></html>
