# The progress page (docs/) with a playable demo: GameViber's own starter
# game (gameviber new — no outside assets), built for the browser.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        # The window (backend/ebiten, cmd/gameviber-run) needs X11 headers to
        # build for the desktop; the page builds it for the browser below.
        run: go test $(go list ./... | grep -v -e /backend/ebiten -e /cmd/gameviber-run)
      - name: Pages from docs (Jekyll renders the Markdown)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: The demo
        run: |
          go run ./cmd/gameviber new /tmp/kolektu
          go run ./cmd/gameviber web /tmp/kolektu /tmp/demo
          sudo cp -r /tmp/demo _site/demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
